<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية رورو الخاصة ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { margin: 0; background: #000; color: #fff; font-family: 'Cairo', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .screen { display: none; text-align: center; width: 90%; max-width: 400px; animation: glow 2s infinite alternate; }
        .active { display: block; }
        
        @keyframes glow { from { text-shadow: 0 0 10px #ff4d6d; } to { text-shadow: 0 0 25px #ff4d6d; } }
        
        .box { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 25px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.2); }
        input { background: transparent; border: 2px solid #ff4d6d; color: white; padding: 15px; border-radius: 15px; width: 80%; font-size: 20px; text-align: center; margin-bottom: 20px; }
        button { background: #ff4d6d; color: white; border: none; padding: 15px 30px; border-radius: 15px; font-size: 18px; cursor: pointer; transition: 0.3s; }
        
        #hearts { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .heart { position: absolute; color: #ff4d6d; font-size: 20px; animation: fly 4s linear infinite; }
        @keyframes fly { from { transform: translateY(100vh); opacity: 1; } to { transform: translateY(-10vh); opacity: 0; } }
    </style>
</head>
<body>

    <div id="hearts"></div>

    <div id="s1" class="screen active box">
        <h2>أهلاً يا رورو ❤️</h2>
        <input type="password" id="pass" placeholder="1234" maxlength="4">
        <br><button onclick="go(2)">دخول</button>
    </div>

    <div id="s2" class="screen box">
        <h2>اختاري الهدايا (3 مرات) 🎁</h2>
        <div style="font-size: 50px; cursor: pointer;" onclick="count('gift')">🎁</div>
        <p id="giftCount">0 / 3</p>
    </div>

    <div id="s3" class="screen box">
        <h2>افتحي الظرف (3 مرات) 💌</h2>
        <div style="font-size: 50px; cursor: pointer;" onclick="count('env')">💌</div>
        <p id="envCount">0 / 3</p>
    </div>

    <div id="s4" class="screen box">
        <h1 style="color: #ff4d6d;">عيد ميلاد سعيد يا رورو 🎉</h1>
        <p>بحبك يا رورو.. حقك عليّ يا أغلى الناس، كل سنة وأنتِ منورة دنيتي كلها.</p>
    </div>

    <script>
        let g = 0, e = 0;
        function go(s) {
            if(s==2 && document.getElementById('pass').value != "1234") return alert("غلط يا بطتي!");
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById('s'+s).classList.add('active');
        }
        function count(type) {
            if(type=='gift') { g++; document.getElementById('giftCount').innerText = g + " / 3"; if(g==3) go(3); }
            else { e++; document.getElementById('envCount').innerText = e + " / 3"; if(e==3) go(4); }
        }
        // قلوب تتساقط
        setInterval(() => {
            let h = document.createElement('div');
            h.innerHTML = '❤️'; h.className = 'heart';
            h.style.left = Math.random()*100 + 'vw';
            document.getElementById('hearts').appendChild(h);
            setTimeout(() => h.remove(), 4000);
        }, 300);
    </script>
</body>
</html>
